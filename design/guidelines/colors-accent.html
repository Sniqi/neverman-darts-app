<!-- @dsCard group="Colors" viewport="700x150" subtitle="Single amber accent + derivatives" name="Accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.chip{height:64px;border-radius:12px;border:1px solid var(--line);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
</style></head><body><div class="sw"><div class="chip" style="background:var(--accent);"></div><div class="lbl">Amber accent</div><div class="val">--accent</div></div><div class="sw"><div class="chip" style="background:var(--accent-bright);"></div><div class="lbl">Hover / glow</div><div class="val">--accent-bright</div></div><div class="sw"><div class="chip" style="background:var(--accent-deep);"></div><div class="lbl">Gradient tail</div><div class="val">--accent-deep</div></div><div class="sw"><div class="chip" style="background:var(--accent-soft);"></div><div class="lbl">Soft tint</div><div class="val">--accent-soft</div></div><div class="sw"><div class="chip" style="background:var(--accent-line);"></div><div class="lbl">Accent line</div><div class="val">--accent-line</div></div><div class="sw"><div class="chip" style="background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:600;">Aa</div><div class="lbl">Text on accent</div><div class="val">--on-accent</div></div></body></html>
