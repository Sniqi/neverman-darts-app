<!-- @dsCard group="Colors" viewport="700x150" subtitle="SVG board segment fills" name="Dartboard" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.chip{height:64px;border-radius:8px;border:1px solid var(--line);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
</style></head><body><div class="sw"><div class="chip" style="background:var(--board-single);"></div><div class="lbl">Singles</div><div class="val">--board-single</div></div><div class="sw"><div class="chip" style="background:var(--board-red);"></div><div class="lbl">Red segments</div><div class="val">--board-red</div></div><div class="sw"><div class="chip" style="background:var(--board-green);"></div><div class="lbl">Green segments</div><div class="val">--board-green</div></div><div class="sw"><div class="chip" style="background:var(--board-stroke);"></div><div class="lbl">Segment stroke</div><div class="val">--board-stroke</div></div><div class="sw"><div class="chip" style="background:var(--board-bg);"></div><div class="lbl">Board bg</div><div class="val">--board-bg</div></div></body></html>
