<!-- @dsCard group="Colors" viewport="700x150" subtitle="Alpha hairlines and input borders" name="Hairlines & Borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.chip{height:64px;border-radius:8px;border:1px solid var(--line);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
</style></head><body><div class="sw"><div class="chip" style="background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);"></div><div class="lbl">Card hairline 8%</div><div class="val">--line</div></div>
   <div class="sw"><div class="chip" style="background:var(--surface);border:1px solid var(--line-strong);"></div><div class="lbl">Strong hairline 14%</div><div class="val">--line-strong</div></div>
   <div class="sw"><div class="chip" style="background:var(--surface);border:1px solid var(--border-input);"></div><div class="lbl">Input border 16%</div><div class="val">--border-input</div></div>
   <div class="sw"><div class="chip" style="background:var(--surface);box-shadow:inset 4px 0 0 var(--accent);"></div><div class="lbl">Active card edge</div><div class="val">inset 4px --accent</div></div></body></html>
