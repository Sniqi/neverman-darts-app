<!-- @dsCard group="Colors" viewport="700x150" subtitle="Destructive, positive, triple flash, text" name="Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.chip{height:64px;border-radius:12px;border:1px solid var(--line);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
</style></head><body><div class="sw"><div class="chip" style="background:var(--destructive);"></div><div class="lbl">Destructive / bust</div><div class="val">--destructive</div></div><div class="sw"><div class="chip" style="background:var(--positive);"></div><div class="lbl">Leg / checkout won</div><div class="val">--positive</div></div><div class="sw"><div class="chip" style="background:var(--triple);"></div><div class="lbl">Triple flash</div><div class="val">--triple</div></div><div class="sw"><div class="chip" style="background:var(--text);"></div><div class="lbl">Text</div><div class="val">--text</div></div><div class="sw"><div class="chip" style="background:var(--text-soft);"></div><div class="lbl">Soft text</div><div class="val">--text-soft</div></div><div class="sw"><div class="chip" style="background:var(--text-muted);"></div><div class="lbl">Muted text</div><div class="val">--text-muted</div></div></body></html>
