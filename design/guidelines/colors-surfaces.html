<!-- @dsCard group="Colors" viewport="700x150" subtitle="Dark-mode layer stack" name="Surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.chip{height:64px;border-radius:8px;border:1px solid var(--line);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
</style></head><body><div class="sw"><div class="chip" style="background:var(--bg-deep);"></div><div class="lbl">Deepest</div><div class="val">--bg-deep</div></div><div class="sw"><div class="chip" style="background:var(--bg);"></div><div class="lbl">Page bg</div><div class="val">--bg</div></div><div class="sw"><div class="chip" style="background:var(--surface);"></div><div class="lbl">Card / control</div><div class="val">--surface</div></div><div class="sw"><div class="chip" style="background:var(--surface-2);"></div><div class="lbl">Elevated</div><div class="val">--surface-2</div></div><div class="sw"><div class="chip" style="background:var(--surface-3);"></div><div class="lbl">Pressed row</div><div class="val">--surface-3</div></div><div class="sw"><div class="chip" style="background:var(--surface-hint);"></div><div class="lbl">Hint bubble</div><div class="val">--surface-hint</div></div></body></html>
