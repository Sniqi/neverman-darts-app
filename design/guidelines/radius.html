<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Soft, layered corners" name="Corner Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
.rc{height:64px;background:var(--surface);border:1px solid var(--line-strong);}
</style></head><body><div style="display:flex;gap:16px;width:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="rc" style="border-radius:var(--radius-xs);"></div><div class="val">--radius-xs 8</div><div class="lbl">tags, inner segments</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="rc" style="border-radius:var(--radius-sm);"></div><div class="val">--radius-sm 12</div><div class="lbl">buttons, keys, chips</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="rc" style="border-radius:var(--radius-md);"></div><div class="val">--radius-md 16</div><div class="lbl">cards, list boxes</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="rc" style="border-radius:var(--radius-lg);"></div><div class="val">--radius-lg 20</div><div class="lbl">dialogs, sheets</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="rc" style="border-radius:var(--radius-pill);"></div><div class="val">--radius-pill</div><div class="lbl">dart pills, switches</div></div>
  </div></body></html>
