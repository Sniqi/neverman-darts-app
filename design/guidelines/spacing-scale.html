<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Strict multiples of 4" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
.sq{background:var(--accent-soft);border:1px solid var(--accent-line);}
</style></head><body><div style="display:flex;align-items:flex-end;gap:20px;width:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:4px;height:4px;"></div><div class="val">--space-xs</div><div class="lbl">4px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:8px;height:8px;"></div><div class="val">--space-sm</div><div class="lbl">8px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:16px;height:16px;"></div><div class="val">--space-md</div><div class="lbl">16px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:24px;height:24px;"></div><div class="val">--space-lg</div><div class="lbl">24px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:32px;height:32px;"></div><div class="val">--space-xl</div><div class="lbl">32px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:48px;height:48px;"></div><div class="val">--space-2xl</div><div class="lbl">48px</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;"><div class="sq" style="width:64px;height:64px;"></div><div class="val">--space-3xl</div><div class="lbl">64px</div></div>
  </div></body></html>
