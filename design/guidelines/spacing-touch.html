<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val{font-size:12px;color:var(--text);}
.box{background:var(--surface);border:1px solid var(--border-input);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;}
</style></head><body><div style="display:flex;align-items:flex-end;gap:16px;width:100%;">
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="box" style="height:48px;">48px</div><div class="val">--hit-min</div><div class="lbl">steppers, icon buttons</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="box" style="height:56px;">56px</div><div class="val">--control-h</div><div class="lbl">chips, slots, segments</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="box" style="height:64px;">64px</div><div class="val">--row-h</div><div class="lbl">menu rows, CTA</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div class="box" style="height:76px;">76px</div><div class="val">--key-h</div><div class="lbl">numpad keys</div></div>
  </div></body></html>
