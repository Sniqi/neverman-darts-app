<!-- @dsCard group="Type" viewport="700x150" subtitle="T/D prefixes, Bull, Miss" name="Dart Notation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{display:flex;align-items:center;padding:16px;gap:10px;font-family:var(--font-ui);}
.lbl{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{display:inline-flex;padding:.12em .55em;border-radius:var(--radius-pill);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;}
</style></head><body><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <span class="pill" style="color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);">T20</span>
    <span class="pill" style="color:var(--accent-double);background:color-mix(in oklab, var(--accent) 7%, transparent);border:1px solid color-mix(in oklab, var(--accent) 30%, transparent);">D16</span>
    <span class="pill" style="color:var(--text-soft);background:rgba(255,255,255,.06);border:1px solid var(--line);">20</span>
    <span class="pill" style="color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);">Bull</span>
    <span class="pill" style="color:var(--text-faint);background:rgba(255,255,255,.06);border:1px dashed var(--line-strong);">✕</span>
    <span class="pill" style="color:color-mix(in oklab, var(--destructive) 75%, white);background:var(--destructive-soft);border:1px solid var(--destructive-line);text-decoration:line-through;">T19</span>
    <span class="lbl">triple · double · single · bull · miss · bust</span>
  </div></body></html>
