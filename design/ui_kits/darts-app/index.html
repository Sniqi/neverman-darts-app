<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neverman Darts — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%;}#root{height:100%;}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('nvd-uikit-route')) || { screen: 'start' }; }
    catch { return { screen: 'start' }; }
  });
  const go = (screen, config) => {
    const r = { screen, config };
    setRoute(r);
    try { localStorage.setItem('nvd-uikit-route', JSON.stringify(r)); } catch {}
  };
  const S = { start: StartScreen, setup: SetupScreen, match: MatchScreen, display: DisplayScreen, history: HistoryScreen, stats: StatsScreen }[route.screen] || StartScreen;
  return <div style={{height:'100%',position:'relative'}}><S go={go} config={route.config} /></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
